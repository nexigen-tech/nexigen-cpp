version: 1.0
daemon_name: "nexigen_log_daemon"

# ==============================================================================
# 1. СИСТЕМНЫЕ РЕСУРСЫ И ПРИВЯЗКА К ЯДРАМ (REQ_LOGD_002)
# ==============================================================================
resources:
  # Привязка всех потоков демона к сервисному/фоновому ядру (например, CPU 0)
  # Гарантирует изоляцию от вычислительных Real-Time ядер (CPU 1-3)
  bg_cpu_affinity: [0]
  scheduling_policy: "SCHED_OTHER"
  priority_nice: 10
  
  # Ограничение ввода-вывода (cgroups v2), чтобы не забить диск для других служб
  io_throttle:
    max_write_bytes_per_sec: "10MB"

# ==============================================================================
# 2. НАСТРОЙКИ IPC-ТРАНСПОРТА ICEORYX2 (REQ_LOGD_003)
# ==============================================================================
ipc_iceoryx2:
  service_name: "nexigen/log/stream"
  event_channel: "nexigen/log/events"
  # Таймаут пакетного пробуждения WaitSet (сброс накопленного даже при малом трафике)
  batch_timeout_ms: 50

# ==============================================================================
# 3. ЗАЩИТА ОТ СПАМА И ТРОТТЛИНГ (REQ_LOGD_007)
# ==============================================================================
throttling:
  enabled: true
  max_messages_per_sec_per_context: 50
  burst_limit: 100

# ==============================================================================
# 4. ПРАВИЛА МАРШРУТИЗАЦИИ И ФИЛЬТРАЦИИ ПО ПРИЕМНИКАМ (SINKS)
# ==============================================================================
sinks:

  # ----------------------------------------------------------------------------
  # ПРИЕМНИК 1: НАКОПИТЕЛЬ / ФЛЕШ-ПАМЯТЬ (REQ_LOGD_005, REQ_LOGD_008 - REQ_LOGD_010)
  # Задача: Беречь ресурс eMMC, писать только критичное крупными блоками.
  # ----------------------------------------------------------------------------
  storage:
    enabled: true
    log_directory: "/var/log/easyauto"
    file_prefix: "system_trace"
    format: "jsonl"              # jsonl (для парсеров) или plain_text
    
    # Глобальный порог для записи на диск
    default_min_level: "Warn"   # Пропускаются только kWarn, kError, kFatal
    
    # Исключения для ключевых системных компонентов:
    # разрешаем им писать kInfo на диск для отслеживания старта и смены состояний
    context_overrides:
      - app_id: "EM"
        min_level: "Info"
      - app_id: "SM"
        min_level: "Info"
      - app_id: "PHM"
        min_level: "Info"

    # Параметры буферизации записи (уменьшение числа syscalls)
    buffer_flush:
      buffer_size_kb: 64
      max_interval_ms: 500

    # Ротация и защита от переполнения диска
    rotation:
      max_file_size_mb: 20
      max_archive_files: 5
      compression: "zstd"        # Сжатие архивных логов в фоновом потоке

  # ----------------------------------------------------------------------------
  # ПРИЕМНИК 2: СЕТЕВАЯ ТРАНСЛЯЦИЯ В РЕАЛЬНОМ ВРЕМЕНИ (REQ_LOGD_006, REQ_LOGD_011)
  # Задача: Отладка инженером на ноутбуке без засорения флеш-накопителя.
  # ----------------------------------------------------------------------------
  network:
    enabled: true
    protocol: "udp"              # udp или tcp
    endpoint: "239.255.0.1:9999" # UDP Multicast для диагностического стенда
    
    # По умолчанию в сеть транслируется информационный поток
    default_min_level: "kInfo"
    
    # Пример: инженер точечно запросил полный отладочный лог конкретного сенсора
    context_overrides:
      - app_id: "LIDAR"
        context_id: "SENS"
        min_level: "Verbose"    # Полный поток на стенд без записи на диск!

    # Управляющий сокет для CLI-утилиты (смена фильтров на лету REQ_LOGD_012)
    control_server:
      enabled: true
      listen_port: 8888

  # ----------------------------------------------------------------------------
  # ПРИЕМНИК 3: КОЛЬЦЕВОЙ БУФЕР АВАРИЙНОГО ДАМПА В ОЗУ (REQ_LOGD_010)
  # Задача: Сохранить в RAM историю "за секунду до катастрофы" и сбросить при crash.
  # ----------------------------------------------------------------------------
  crash_dump:
    enabled: true
    ring_buffer_capacity: 5000   # Хранит последние 5000 сообщений в RAM
    min_level: "Debug"          # Запоминает даже детальный отладочный след
    output_directory: "/var/log/easyauto/dumps"
    
    # Триггеры для моментального сохранения содержимого RAM на диск
    triggers:
      - on_level: "Fatal"
      - on_system_state: "SafeState"
      - on_signal: ["SIGSEGV", "SIGABRT", "SIGTERM"]
