site_name: nexigen platform
theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mkdoxy:
      projects:
        platform_api:
          src-dirs: include/
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.hpp *.h"
            RECURSIVE: True

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details

nav:
  - Главная: index.md
  - Архитектура: architecture.md
  - Статьи:
      - Обзор платформы: articles/platform.md
      - core: articles/core.md
      - chrono: articles/chrono.md
      - com: articles/com.md
      - app: articles/app.md
      - exec: articles/exec.md
      - sm: articles/sm.md
      - phm: articles/phm.md
      - hub: articles/hub.md
      - metrics: articles/metrics.md
      - tracing: articles/tracing.md
      - diagnostics: articles/diagnostics.md
      - synchro: articles/synchro.md
      - logging: articles/logging.md
      - log viewer: articles/log-viewer.md
      - recorder: articles/recorder.md
  - Руководства:
      - Минимальные задержки: low-latency-guide.md
  - Безопасность:
      - Трассировка требований: safety/traceability.md
  - Спецификации (OpenSpec):
      - Обзор требований: specs/index.md
      # Сюда будут подтягиваться файлы из openspec/specs/
  - Справочник C++ API:
      - Классы: platform_api/annotated.md
      - Пространства имён: platform_api/namespaces.md
      - Файлы: platform_api/files.md
