name: CI

on:
  push:
    branches:
      - main
      - master
      - learning-enhancement
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  build-test:
    name: Build & test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    container:
      image: gcc:15
      # TSan calls personality(ADDR_NO_RANDOMIZE); Docker's default seccomp
      # profile blocks it, so TSan fails intermittently in a container.
      options: ${{ matrix.container_options }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug
            build_type: Debug
            cmake_args: "-DNEXIGEN_ENABLE_FAULT_INJECTION=ON"
            container_options: ""
          - name: Release
            build_type: Release
            # Shared runners cannot guarantee the 20 ns latency budget; the
            # dedicated-hardware gate stays available via the default ON.
            cmake_args: "-DNEXIGEN_STRICT_LATENCY_TESTS=OFF"
            container_options: ""
          - name: PortableRelease
            build_type: Release
            # Distribution artifacts must run on CPUs other than the builder.
            cmake_args: "-DNEXIGEN_STRICT_LATENCY_TESTS=OFF -DNEXIGEN_NATIVE_ARCH=OFF"
            container_options: ""
          - name: TSan
            build_type: RelWithDebInfo
            cmake_args: "-DNEXIGEN_ENABLE_TSAN=ON"
            container_options: "--security-opt seccomp=unconfined"
          - name: ASan
            build_type: Debug
            cmake_args: "-DNEXIGEN_ENABLE_ASAN=ON"
            container_options: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake curl git ninja-build

      - name: Configure
        run: |
          cmake -S . -B "build/${{ matrix.name }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build "build/${{ matrix.name }}" --parallel 2

      - name: Test
        run: ctest --test-dir "build/${{ matrix.name }}" --output-on-failure

  clang:
    name: Build & test (Clang)
    runs-on: ubuntu-24.04
    # Pair Clang with the GCC 15 libstdc++: std::expected (C++23) is missing
    # from the Ubuntu 24.04 system libstdc++ 13, so a distro-only Clang image
    # cannot compile the headers even though the compiler itself is modern.
    container: gcc:15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates clang clang-tidy cmake curl git ninja-build nlohmann-json3-dev

      - name: Configure
        run: |
          cmake -S . -B build/clang -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build/clang --parallel 2

      - name: Test
        run: ctest --test-dir build/clang --output-on-failure

      - name: clang-tidy
        run: |
          git ls-files 'src/*.cpp' \
            | xargs -n 1 -P 2 clang-tidy -p build/clang -quiet

      - name: Fuzz HTTP parser
        run: |
          cmake -S . -B build/fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DNEXIGEN_BUILD_TESTS=OFF \
            -DNEXIGEN_BUILD_EXAMPLES=OFF \
            -DNEXIGEN_BUILD_TOOLS=OFF \
            -DNEXIGEN_BUILD_FUZZERS=ON
          cmake --build build/fuzz --target nexigen_http_parse_fuzz --parallel 2
          ./build/fuzz/nexigen_http_parse_fuzz -runs=20000 \
            tests/fuzz/corpus/http_parse

      - name: Package smoke test
        run: ./tests/packaging/smoke_test.sh build/clang

  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          python3 -m venv "$RUNNER_TEMP/format-venv"
          "$RUNNER_TEMP/format-venv/bin/pip" install clang-format==22.1.8
          echo "$RUNNER_TEMP/format-venv/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          cmake \
            -DCLANG_FORMAT="$(command -v clang-format)" \
            -DSOURCE_DIR="$PWD" \
            -DFORMAT_MODE=check \
            -P cmake/RunClangFormat.cmake

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    container: gcc:15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake curl git ninja-build python3

      - name: Check Result::value ban
        run: python3 cmake/check_result_value.py

      - name: Check PascalCase type naming
        run: python3 cmake/check_naming.py

      - name: Configure
        run: |
          cmake -S . -B build/coverage -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNEXIGEN_ENABLE_COVERAGE=ON \
            -DNEXIGEN_ENABLE_FAULT_INJECTION=ON \
            -DNEXIGEN_COVERAGE_FAIL_UNDER=95

      - name: Run coverage gate
        run: cmake --build build/coverage --target coverage --parallel 2

  openspec:
    name: OpenSpec
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.14.3

      - name: Validate specs and changes
        run: |
          openspec validate --specs
          openspec validate --changes --strict

  complexity:
    name: Complexity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Python and lizard
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip
          python3 -m pip install lizard

      - name: Check cyclomatic complexity (CCN ≤ 15, exclude examples/, filter alignas)
        run: |
          cmake -S . -B build/complexity -G Ninja
          cmake --build build/complexity --target complexity-check
